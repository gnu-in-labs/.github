<svg width="1280" height="460" viewBox="0 0 1280 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gnu.in.labs public surfaces board</title>
  <desc id="desc">Current public surfaces with explicit states: gnu6.live is available, gnu.in.docs is public with a registry refresh in progress, and gnosis.OS is in active development with no approved public release.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="460" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E3"/>
      <stop offset="0.62" stop-color="#F8F2E6"/>
      <stop offset="1" stop-color="#F9E7CF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="460" fill="url(#paper)"/>

  <!-- header -->
  <g transform="translate(84,30)">
    <polygon points="13,1 24,7.5 13,14 2,7.5" fill="#FF8A3D"/>
    <polygon points="2,7.5 13,14 13,27 2,20.5" fill="#E05500"/>
    <polygon points="13,14 24,7.5 24,20.5 13,27" fill="#FF6A00"/>
  </g>
  <text x="128" y="50" fill="#3A3F49" font-family="Space Grotesk, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" letter-spacing="2.6">gnu.in.labs · PUBLIC SURFACES · STATUS FIRST</text>
  <text x="1196" y="50" text-anchor="end" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" font-weight="600" letter-spacing="1.2">access · maturity · evidence</text>

  <g font-family="Space Grotesk, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="82" y="140" fill="#22252D" font-size="56" font-weight="800" letter-spacing="-1.5">Current public surfaces<tspan fill="#FF6A00">.</tspan></text>
    <text x="84" y="180" fill="#5F6B7A" font-size="19">Availability, maturity, and evidence remain separate.</text>
    <rect x="84" y="202" width="64" height="5" rx="2.5" fill="#FF6A00"/>
  </g>

  <!-- surface cards -->
  <g font-family="Space Grotesk, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(84,244)">
      <rect width="356" height="164" rx="18" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
      <rect x="0" y="22" width="5" height="120" rx="2.5" fill="#4169E1"/>
      <text x="28" y="42" fill="#22252D" font-size="20" font-weight="850">gnu6.live</text>
      <rect x="252" y="22" width="76" height="28" rx="14" fill="#DFE6F9"/>
      <text x="290" y="40" text-anchor="middle" fill="#2C4CB8" font-size="11" font-weight="850" letter-spacing="1.4">AVAILABLE</text>
      <text x="28" y="78" fill="#5F6B7A" font-size="14">public information, documentation,</text>
      <text x="28" y="100" fill="#5F6B7A" font-size="14">references, status, authorized entry</text>
      <text x="28" y="136" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12">https://gnu6.live</text>
    </g>
    <g transform="translate(462,244)">
      <rect width="356" height="164" rx="18" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
      <rect x="0" y="22" width="5" height="120" rx="2.5" fill="#5F7F52"/>
      <text x="28" y="42" fill="#22252D" font-size="20" font-weight="850">gnu.in.docs</text>
      <rect x="252" y="22" width="76" height="28" rx="14" fill="#E4EBDD"/>
      <text x="290" y="40" text-anchor="middle" fill="#47613C" font-size="11" font-weight="850" letter-spacing="1.4">PUBLIC</text>
      <text x="28" y="78" fill="#5F6B7A" font-size="14">bilingual claim, evidence,</text>
      <text x="28" y="100" fill="#5F6B7A" font-size="14">limitations, and direction</text>
      <text x="28" y="136" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12">registry refresh in progress</text>
    </g>
    <g transform="translate(840,244)">
      <rect width="356" height="164" rx="18" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
      <rect x="0" y="22" width="5" height="120" rx="2.5" fill="#FF6A00"/>
      <text x="28" y="42" fill="#22252D" font-size="20" font-weight="850">gnosis.OS</text>
      <rect x="216" y="22" width="112" height="28" rx="14" fill="#FFE7D6"/>
      <text x="272" y="40" text-anchor="middle" fill="#C35000" font-size="11" font-weight="850" letter-spacing="1.4">ACTIVE DEV</text>
      <text x="28" y="78" fill="#5F6B7A" font-size="14">local Linux-session integration</text>
      <text x="28" y="100" fill="#5F6B7A" font-size="14">no approved public release</text>
      <text x="28" y="136" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12">maintainer-verified private</text>
    </g>
  </g>
</svg>
