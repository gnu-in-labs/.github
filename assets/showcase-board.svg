<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gnu.in.labs public surfaces board</title>
  <desc id="desc">Three public surfaces: gnu6.live is online as the public web and services entrypoint, the .github repository is public with organization defaults, and Gnosis.OS is an experimental desktop runtime with public readiness in progress.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071013"/>
      <stop offset="0.55" stop-color="#141C24"/>
      <stop offset="1" stop-color="#241A20"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="60" y="62" fill="#F7FBF7" font-size="19" font-weight="850">public surfaces</text>
    <text x="242" y="62" fill="#8FA6A0" font-size="14" font-weight="700">status is stated, not implied</text>

    <g>
      <rect x="60" y="92" width="380" height="220" rx="20" fill="#0B1518" fill-opacity="0.9" stroke="#55D6BE" stroke-opacity="0.44"/>
      <rect x="88" y="118" width="94" height="32" rx="16" fill="#55D6BE" fill-opacity="0.16" stroke="#55D6BE" stroke-opacity="0.5"/>
      <text x="110" y="140" fill="#D7FFF1" font-size="14" font-weight="850">online</text>
      <text x="88" y="196" fill="#F7FBF7" font-size="26" font-weight="850">gnu6.live</text>
      <text x="88" y="232" fill="#BFE9DD" font-size="14" font-weight="700">public web and services</text>
      <text x="88" y="254" fill="#BFE9DD" font-size="14" font-weight="700">entrypoint for GNU.IN</text>
      <text x="88" y="276" fill="#BFE9DD" font-size="14" font-weight="700">experiments</text>
    </g>

    <g>
      <rect x="460" y="92" width="380" height="220" rx="20" fill="#0B1518" fill-opacity="0.9" stroke="#F2C14E" stroke-opacity="0.44"/>
      <rect x="488" y="118" width="94" height="32" rx="16" fill="#F2C14E" fill-opacity="0.16" stroke="#F2C14E" stroke-opacity="0.5"/>
      <text x="510" y="140" fill="#FFE3A3" font-size="14" font-weight="850">public</text>
      <text x="488" y="196" fill="#F7FBF7" font-size="26" font-weight="850">.github</text>
      <text x="488" y="232" fill="#FFE3A3" font-size="14" font-weight="700">organization profile,</text>
      <text x="488" y="254" fill="#FFE3A3" font-size="14" font-weight="700">contribution defaults,</text>
      <text x="488" y="276" fill="#FFE3A3" font-size="14" font-weight="700">security and templates</text>
    </g>

    <g>
      <rect x="860" y="92" width="380" height="220" rx="20" fill="#0B1518" fill-opacity="0.9" stroke="#B48EED" stroke-opacity="0.44"/>
      <rect x="888" y="118" width="130" height="32" rx="16" fill="#B48EED" fill-opacity="0.16" stroke="#B48EED" stroke-opacity="0.5"/>
      <text x="906" y="140" fill="#E7D9FF" font-size="14" font-weight="850">in progress</text>
      <text x="888" y="196" fill="#F7FBF7" font-size="26" font-weight="850">Gnosis.OS</text>
      <text x="888" y="232" fill="#E7D9FF" font-size="14" font-weight="700">experimental local-first</text>
      <text x="888" y="254" fill="#E7D9FF" font-size="14" font-weight="700">desktop runtime; public</text>
      <text x="888" y="276" fill="#E7D9FF" font-size="14" font-weight="700">readiness being shaped</text>
    </g>
  </g>
</svg>
