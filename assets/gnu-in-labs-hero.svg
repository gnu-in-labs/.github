<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gnu.in.labs organization hero</title>
  <desc id="desc">Paper-toned banner: gnu.in.labs builds local-first desktop systems, public infrastructure, and reviewable automation. Visible automation, human-gated change, user-owned computing. An evidence board lists gnu6.live online, Gnosis.OS in progress, and the .github defaults as public.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="560" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F1E3"/>
      <stop offset="0.62" stop-color="#F8F2E6"/>
      <stop offset="1" stop-color="#F9E7CF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="560" fill="url(#paper)"/>

  <!-- header -->
  <g transform="translate(84,38)">
    <polygon points="13,1 24,7.5 13,14 2,7.5" fill="#FF8A3D"/>
    <polygon points="2,7.5 13,14 13,27 2,20.5" fill="#E05500"/>
    <polygon points="13,14 24,7.5 24,20.5 13,27" fill="#FF6A00"/>
  </g>
  <text x="128" y="58" fill="#3A3F49" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="800" letter-spacing="2.6">GNU.IN LABS · PUBLIC ORG PROFILE · ORG-WIDE DEFAULTS</text>
  <text x="1196" y="58" text-anchor="end" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="12" font-weight="600" letter-spacing="1.2">evidence-led · human-gated</text>
  <line x1="84" y1="76" x2="1196" y2="76" stroke="#E2DBC8" stroke-width="1.5"/>

  <!-- wordmark -->
  <text x="78" y="212" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="118" font-weight="800" letter-spacing="-3" fill="#22252D">gnu<tspan fill="#FF6A00">.</tspan>in<tspan fill="#FF6A00">.</tspan>labs</text>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="84" y="272" fill="#22252D" font-size="31" font-weight="800" letter-spacing="-0.5">Local-first desktop systems, public</text>
    <text x="84" y="312" fill="#22252D" font-size="31" font-weight="800" letter-spacing="-0.5">infrastructure, and reviewable automation<tspan fill="#FF6A00">.</tspan></text>
    <rect x="84" y="336" width="64" height="5" rx="2.5" fill="#FF6A00"/>
    <text x="84" y="386" fill="#5F6B7A" font-size="21">Visible automation. Human-gated change. User-owned computing.</text>
  </g>

  <!-- capability chips -->
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="84" y="440" width="236" height="66" rx="16" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
    <rect x="104" y="461" width="24" height="20" rx="5" fill="none" stroke="#FF6A00" stroke-width="2.2"/>
    <path d="M109 467l4 4 -4 4 M117 476h5" stroke="#FF6A00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(0,-1)"/>
    <text x="142" y="468" fill="#22252D" font-size="13.5" font-weight="800" letter-spacing="1.6">LOCAL-FIRST</text>
    <text x="142" y="490" fill="#5F6B7A" font-size="12.5">local machine · local data</text>

    <rect x="340" y="440" width="236" height="66" rx="16" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
    <g stroke="#FF6A00" stroke-width="2.2" fill="none">
      <circle cx="364" cy="465" r="4"/>
      <circle cx="380" cy="483" r="4"/>
      <path d="M364 469v6a8 8 0 0 0 8 8h4" stroke-linecap="round"/>
    </g>
    <text x="398" y="468" fill="#22252D" font-size="13.5" font-weight="800" letter-spacing="1.6">REVIEWABLE</text>
    <text x="398" y="490" fill="#5F6B7A" font-size="12.5">source · diff · gate</text>

    <rect x="596" y="440" width="236" height="66" rx="16" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
    <g stroke="#FF6A00" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M632 464a11 11 0 1 1 -11 -8"/>
      <path d="M615 452l6 3 -3 6" stroke-linejoin="round"/>
    </g>
    <text x="654" y="468" fill="#22252D" font-size="13.5" font-weight="800" letter-spacing="1.6">REVERSIBLE</text>
    <text x="654" y="490" fill="#5F6B7A" font-size="12.5">backup · rollback path</text>
  </g>

  <!-- evidence board -->
  <rect x="856" y="118" width="372" height="372" rx="22" fill="none" stroke="#FF6A00" stroke-width="1.8" stroke-dasharray="7 7" opacity="0.75"/>
  <g>
    <rect x="898" y="102" width="196" height="34" rx="17" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
    <g transform="translate(914,109) scale(0.72)">
      <polygon points="13,1 24,7.5 13,14 2,7.5" fill="#FF8A3D"/>
      <polygon points="2,7.5 13,14 13,27 2,20.5" fill="#E05500"/>
      <polygon points="13,14 24,7.5 24,20.5 13,27" fill="#FF6A00"/>
    </g>
    <text x="944" y="124" fill="#D45A00" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="11.5" font-weight="850" letter-spacing="2">EVIDENCE BOARD</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="884" y="158" width="316" height="92" rx="16" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
    <rect x="884" y="174" width="5" height="60" rx="2.5" fill="#4169E1"/>
    <text x="910" y="192" fill="#22252D" font-size="16" font-weight="850">gnu6.live</text>
    <rect x="1106" y="174" width="74" height="26" rx="13" fill="#DFE6F9"/>
    <text x="1143" y="191" text-anchor="middle" fill="#2C4CB8" font-size="10.5" font-weight="850" letter-spacing="1.4">ONLINE</text>
    <text x="910" y="216" fill="#5F6B7A" font-size="12.5">public web and services entrypoint</text>
    <text x="910" y="236" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11">https://gnu6.live</text>

    <rect x="884" y="262" width="316" height="92" rx="16" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
    <rect x="884" y="278" width="5" height="60" rx="2.5" fill="#FF6A00"/>
    <text x="910" y="296" fill="#22252D" font-size="16" font-weight="850">Gnosis.OS</text>
    <rect x="1072" y="278" width="108" height="26" rx="13" fill="#FFE7D6"/>
    <text x="1126" y="295" text-anchor="middle" fill="#C35000" font-size="10.5" font-weight="850" letter-spacing="1.4">IN PROGRESS</text>
    <text x="910" y="320" fill="#5F6B7A" font-size="12.5">experimental local-first desktop runtime</text>
    <text x="910" y="340" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11">public-readiness staged</text>

    <rect x="884" y="366" width="316" height="92" rx="16" fill="#FFFFFF" stroke="#E7E1D2" stroke-width="1.5"/>
    <rect x="884" y="382" width="5" height="60" rx="2.5" fill="#5F7F52"/>
    <text x="910" y="400" fill="#22252D" font-size="16" font-weight="850">.github</text>
    <rect x="1108" y="382" width="72" height="26" rx="13" fill="#E4EBDD"/>
    <text x="1144" y="399" text-anchor="middle" fill="#47613C" font-size="10.5" font-weight="850" letter-spacing="1.4">PUBLIC</text>
    <text x="910" y="424" fill="#5F6B7A" font-size="12.5">org profile, defaults, security policy</text>
    <text x="910" y="444" fill="#8A8273" font-family="IBM Plex Mono, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="11">applies org-wide</text>
  </g>
</svg>
