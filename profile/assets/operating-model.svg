<svg width="1280" height="280" viewBox="0 0 1280 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gnu.in.labs operating model</title>
  <desc id="desc">A five step rail: human intent defines goals and constraints, agents draft reviewable changes, source control records everything, verification produces evidence, and promotion stays human-gated with rollback paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071013"/>
      <stop offset="0.55" stop-color="#141C24"/>
      <stop offset="1" stop-color="#241A20"/>
    </linearGradient>
    <linearGradient id="rail" x1="60" y1="140" x2="1240" y2="140" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6BE"/>
      <stop offset="0.28" stop-color="#A6E22E"/>
      <stop offset="0.52" stop-color="#F2C14E"/>
      <stop offset="0.76" stop-color="#F78154"/>
      <stop offset="1" stop-color="#B48EED"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="280" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="280" rx="28" fill="url(#grid)"/>
  <path d="M70 148 H1210" stroke="url(#rail)" stroke-width="4" stroke-linecap="round" opacity="0.9"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g>
      <rect x="60" y="84" width="204" height="128" rx="18" fill="#0B1518" fill-opacity="0.97" stroke="#55D6BE" stroke-opacity="0.44"/>
      <rect x="82" y="104" width="60" height="8" rx="4" fill="#55D6BE"/>
      <text x="82" y="146" fill="#F7FBF7" font-size="18" font-weight="850">human intent</text>
      <text x="82" y="172" fill="#BFE9DD" font-size="13" font-weight="700">goal, constraints, and</text>
      <text x="82" y="192" fill="#BFE9DD" font-size="13" font-weight="700">stopping criteria</text>
    </g>
    <g>
      <rect x="304" y="84" width="204" height="128" rx="18" fill="#0B1518" fill-opacity="0.97" stroke="#A6E22E" stroke-opacity="0.44"/>
      <rect x="326" y="104" width="60" height="8" rx="4" fill="#A6E22E"/>
      <text x="326" y="146" fill="#F7FBF7" font-size="18" font-weight="850">agent draft</text>
      <text x="326" y="172" fill="#DDEFB8" font-size="13" font-weight="700">inspect context, prepare</text>
      <text x="326" y="192" fill="#DDEFB8" font-size="13" font-weight="700">reviewable changes</text>
    </g>
    <g>
      <rect x="548" y="84" width="204" height="128" rx="18" fill="#0B1518" fill-opacity="0.97" stroke="#F2C14E" stroke-opacity="0.44"/>
      <rect x="570" y="104" width="60" height="8" rx="4" fill="#F2C14E"/>
      <text x="570" y="146" fill="#F7FBF7" font-size="18" font-weight="850">source control</text>
      <text x="570" y="172" fill="#FFE3A3" font-size="13" font-weight="700">every change recorded,</text>
      <text x="570" y="192" fill="#FFE3A3" font-size="13" font-weight="700">nothing lands silently</text>
    </g>
    <g>
      <rect x="792" y="84" width="204" height="128" rx="18" fill="#0B1518" fill-opacity="0.97" stroke="#F78154" stroke-opacity="0.44"/>
      <rect x="814" y="104" width="60" height="8" rx="4" fill="#F78154"/>
      <text x="814" y="146" fill="#F7FBF7" font-size="18" font-weight="850">verification</text>
      <text x="814" y="172" fill="#FFD0C2" font-size="13" font-weight="700">tests, builds, manifests,</text>
      <text x="814" y="192" fill="#FFD0C2" font-size="13" font-weight="700">reviews as evidence</text>
    </g>
    <g>
      <rect x="1036" y="84" width="204" height="128" rx="18" fill="#0B1518" fill-opacity="0.97" stroke="#B48EED" stroke-opacity="0.44"/>
      <rect x="1058" y="104" width="60" height="8" rx="4" fill="#B48EED"/>
      <text x="1058" y="146" fill="#F7FBF7" font-size="18" font-weight="850">promotion</text>
      <text x="1058" y="172" fill="#E7D9FF" font-size="13" font-weight="700">human-gated, with</text>
      <text x="1058" y="192" fill="#E7D9FF" font-size="13" font-weight="700">rollback paths included</text>
    </g>
  </g>

  <g fill="#F7FBF7" fill-opacity="0.55">
    <path d="M298 148 l-12 -7 v14 z"/>
    <path d="M542 148 l-12 -7 v14 z"/>
    <path d="M786 148 l-12 -7 v14 z"/>
    <path d="M1030 148 l-12 -7 v14 z"/>
  </g>
</svg>
