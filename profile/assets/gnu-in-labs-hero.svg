<svg width="1280" height="560" viewBox="0 0 1280 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">gnu.in.labs organization hero</title>
  <desc id="desc">A dark banner for gnu.in.labs: local-first desktop systems, visible automation, and user-owned computing. Principles shown: local-first by default, agents draft while humans decide, automation leaves evidence, and conservative public claims.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071013"/>
      <stop offset="0.36" stop-color="#101D20"/>
      <stop offset="0.68" stop-color="#211824"/>
      <stop offset="1" stop-color="#271B12"/>
    </linearGradient>
    <linearGradient id="rail" x1="110" y1="430" x2="1160" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55D6BE"/>
      <stop offset="0.34" stop-color="#A6E22E"/>
      <stop offset="0.58" stop-color="#F2C14E"/>
      <stop offset="0.82" stop-color="#F78154"/>
      <stop offset="1" stop-color="#B48EED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#FFFFFF" stroke-opacity="0.055"/>
    </pattern>
  </defs>

  <rect width="1280" height="560" rx="36" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="36" fill="url(#grid)"/>
  <path d="M104 418 C230 308 318 366 454 250 C588 136 706 214 832 150 C960 84 1048 94 1180 48" stroke="url(#rail)" stroke-width="5" stroke-linecap="round"/>
  <path d="M104 462 C268 360 388 414 558 308 C714 210 826 248 994 172 C1086 130 1138 126 1212 122" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>
  <path d="M112 340 C240 288 332 312 458 210 C596 100 720 146 842 104 C934 72 1036 66 1142 34" stroke="#55D6BE" stroke-opacity="0.22" stroke-width="2" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="72" y="74" width="650" height="318" rx="26" fill="#0B1518" fill-opacity="0.8" stroke="#D7FFF1" stroke-opacity="0.24"/>
    <rect x="96" y="96" width="112" height="10" rx="5" fill="#55D6BE"/>
    <rect x="224" y="96" width="62" height="10" rx="5" fill="#F2C14E"/>
    <rect x="302" y="96" width="44" height="10" rx="5" fill="#F78154"/>
    <text x="98" y="168" fill="#F7FBF7" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="64" font-weight="850">gnu.in.labs</text>
    <text x="100" y="220" fill="#BFE9DD" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="750">local-first systems, visible automation</text>
    <text x="100" y="264" fill="#E6EEE9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">user-owned computing: inspectable, scriptable,</text>
    <text x="100" y="294" fill="#E6EEE9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">reversible — and under the user&#8217;s control</text>
    <text x="100" y="340" fill="#F2C14E" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="800">Experimental, in public, on purpose.</text>
  </g>

  <g filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="790" y="102" width="392" height="334" rx="26" fill="#11171D" fill-opacity="0.74" stroke="#FFE3A3" stroke-opacity="0.24"/>
    <text x="826" y="154" fill="#F7FBF7" font-size="19" font-weight="850">principles</text>
    <rect x="826" y="186" width="292" height="46" rx="23" fill="#55D6BE" fill-opacity="0.13" stroke="#55D6BE" stroke-opacity="0.38"/>
    <text x="854" y="216" fill="#D7FFF1" font-size="15" font-weight="800">local-first by default</text>
    <rect x="826" y="250" width="292" height="46" rx="23" fill="#B48EED" fill-opacity="0.13" stroke="#B48EED" stroke-opacity="0.38"/>
    <text x="854" y="280" fill="#E7D9FF" font-size="15" font-weight="800">agents draft, humans decide</text>
    <rect x="826" y="314" width="292" height="46" rx="23" fill="#F2C14E" fill-opacity="0.13" stroke="#F2C14E" stroke-opacity="0.38"/>
    <text x="854" y="344" fill="#FFE3A3" font-size="15" font-weight="800">automation leaves evidence</text>
    <rect x="826" y="378" width="292" height="46" rx="23" fill="#F78154" fill-opacity="0.13" stroke="#F78154" stroke-opacity="0.38"/>
    <text x="854" y="408" fill="#FFD0C2" font-size="15" font-weight="800">conservative public claims</text>
  </g>

  <g opacity="0.98" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="84" y="454" width="206" height="44" rx="22" fill="#D7FFF1" fill-opacity="0.12" stroke="#D7FFF1" stroke-opacity="0.26"/>
    <text x="112" y="482" fill="#D7FFF1" font-size="15" font-weight="800">Gnosis.OS runtime</text>
    <rect x="312" y="454" width="206" height="44" rx="22" fill="#FFE3A3" fill-opacity="0.12" stroke="#FFE3A3" stroke-opacity="0.26"/>
    <text x="345" y="482" fill="#FFE3A3" font-size="15" font-weight="800">gnu6.live portal</text>
    <rect x="540" y="454" width="206" height="44" rx="22" fill="#FFD0C2" fill-opacity="0.12" stroke="#FFD0C2" stroke-opacity="0.26"/>
    <text x="570" y="482" fill="#FFD0C2" font-size="15" font-weight="800">org-wide defaults</text>
    <rect x="768" y="454" width="206" height="44" rx="22" fill="#E7D9FF" fill-opacity="0.12" stroke="#E7D9FF" stroke-opacity="0.26"/>
    <text x="796" y="482" fill="#E7D9FF" font-size="15" font-weight="800">learning in public</text>
  </g>
</svg>
